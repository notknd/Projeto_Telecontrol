services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartpick}
      POSTGRES_USER: ${POSTGRES_USER:-smartpick}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  engine:
    build:
      context: ./services/engine
    ports:
      - "${ENGINE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./services/api
    environment:
      PORT: ${API_PORT:-3000}
      HOST: 0.0.0.0
      # Docker uses the internal service DNS; the native .env keeps 127.0.0.1.
      ENGINE_URL: http://engine:8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-smartpick}:${POSTGRES_PASSWORD:-change-me-for-local-development}@db:5432/${POSTGRES_DB:-smartpick}?schema=public
    command: >
      sh -c "npx prisma migrate deploy --schema prisma/schema.prisma &&
      npx prisma db seed --schema prisma/schema.prisma && npm run start"
    depends_on:
      db:
        condition: service_healthy
      engine:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      # O Fastify escuta em IPv4; evitar `localhost` impede que o wget tente ::1 no contêiner.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./apps/web
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api/v1}
    ports:
      - "${WEB_PORT:-5173}:5173"

volumes:
  postgres_data:
